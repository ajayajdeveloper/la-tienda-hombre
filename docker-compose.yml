services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hombre
      POSTGRES_PASSWORD: hombre
      POSTGRES_DB: hombre
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hombre"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
